html, body { margin: 0; padding: 0; }
html, body { width: 2880px; height: 1440px; }
.canvas { position: absolute; top: 0; left: 0; width: 2880px; height: 1440px; overflow: hidden;
  font-family: -apple-system, sans-serif; }
.tag { font-family: "WBT", sans-serif; }
* { font-feature-settings: "calt" 1, "liga" 1, "dlig" 1; }

  .canvas { background:
    linear-gradient(180deg, #38322a 0%, #1c1814 65%, #0a0806 100%); }
  .road-lines { position: absolute; left: 0; right: 0; bottom: 80px; height: 3px;
    background: repeating-linear-gradient(90deg, #5a4a30 0 60px, transparent 60px 120px);
    opacity: 0.5; }
  .bumper { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 2480px; height: 480px;
    background:
      linear-gradient(180deg, #c0bcb2 0%, #f0ece4 25%, #908a7c 55%, #c0bcb2 80%, #5a544a 100%);
    box-shadow: 0 40px 80px rgba(0,0,0,0.6),
      inset 0 0 60px rgba(0,0,0,0.18);
    border-top: 3px solid #2a2620;
    border-bottom: 3px solid #050402;
    border-radius: 14px; }
  .scratches { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 2480px; height: 480px; pointer-events: none; border-radius: 14px;
    background-image:
      linear-gradient(85deg, transparent 30%, rgba(40,30,16,0.3) 30.5%, transparent 31%),
      linear-gradient(80deg, transparent 60%, rgba(40,30,16,0.25) 60.5%, transparent 61%),
      radial-gradient(circle at 18% 60%, rgba(20,14,4,0.4) 8px, transparent 12px),
      radial-gradient(circle at 82% 40%, rgba(20,14,4,0.35) 6px, transparent 10px); }
  .plate { position: absolute; left: 80px; top: 50%; transform: translateY(-50%) rotate(-1deg);
    width: 380px; height: 200px;
    background: #f0ead0; border: 8px solid #1a1410;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "GrebackGrotesque", sans-serif; font-weight: 800; color: #1a1410;
    text-transform: uppercase; }
  .plate .state { font-size: 24px; letter-spacing: 0.3em; opacity: 0.7; }
  .plate .num { font-size: 90px; letter-spacing: 0.06em; line-height: 1; margin-top: 8px; }
  .center-sticker { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-2deg);
    background: #f0e8c8;
    padding: 18px 50px;
    box-shadow: 8px 8px 0 rgba(0,0,0,0.55);
    border: 3px solid #1a1410;
    font-family: "WBT", sans-serif; font-size: 130px; line-height: 0.95; color: #1a1410;
    letter-spacing: -0.02em; white-space: nowrap;
    text-shadow: 2px 0 0 #1a1410, -2px 0 0 #1a1410, 0 2px 0 #1a1410, 0 -2px 0 #1a1410; }
  .stick-l { position: absolute; left: 540px; top: 50%; transform: translateY(-50%) rotate(-9deg);
    background: #c81a1a; color: #f0ead0; padding: 8px 18px;
    font-family: "GrebackGrotesque", sans-serif; font-weight: 800; font-size: 22px;
    letter-spacing: 0.35em; text-transform: uppercase;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5); }
  .stick-r { position: absolute; right: 200px; top: 50%; transform: translateY(-50%) rotate(8deg);
    background: #f0ead0; padding: 8px 16px;
    font-family: "WBT", sans-serif; font-size: 64px; color: #1a1410;
    border: 3px solid #1a1410; box-shadow: 4px 4px 0 rgba(0,0,0,0.5); }
  .top-line { position: absolute; left: 0; right: 0; top: 90px; text-align: center;
    font-family: "GrebackGrotesque", sans-serif; font-weight: 800; font-size: 30px;
    letter-spacing: 0.6em; color: #c0bcb2; text-transform: uppercase; opacity: 0.7; }
  .bot-line { position: absolute; left: 0; right: 0; bottom: 130px; text-align: center;
    font-family: "AvarezoSerif", "Georgia", serif; font-style: italic; font-size: 38px;
    color: #c0bcb2; opacity: 0.85; }
</style>

  <div class="top-line">— rear bumper · '92 wagon · 187,000 miles —</div>
  <div class="bumper"></div>

  <div class="plate">
    <div class="state">— rural route —</div>
    <div class="num">047 BTV</div>

  <div class="stick-l">Local 174</div>
  <div class="center-sticker tag">Honk if you remember</div>
  <div class="stick-r tag">★ KFC</div>
