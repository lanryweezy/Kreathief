html, body { margin: 0; padding: 0; }
html, body { width: 2880px; height: 1440px; }
.canvas { position: absolute; top: 0; left: 0; width: 2880px; height: 1440px; overflow: hidden;
  font-family: -apple-system, sans-serif; }
.tag { font-family: "WBT", sans-serif; }
* { font-feature-settings: "calt" 1, "liga" 1, "dlig" 1; }

  .canvas { background:
    linear-gradient(180deg, #1a1612 0%, #0a0806 100%); }
  .pole { position: absolute; left: 50%; top: 0; bottom: 0; transform: translateX(-50%);
    width: 280px;
    background: linear-gradient(90deg, #2a1f12 0%, #4a3818 50%, #2a1f12 100%);
    box-shadow: 0 0 80px rgba(0,0,0,0.7); }
  .grain { position: absolute; left: 50%; top: 0; bottom: 0; transform: translateX(-50%);
    width: 280px; pointer-events: none;
    background-image: radial-gradient(circle, rgba(40,20,4,0.5) 1px, transparent 2px);
    background-size: 7px 7px; opacity: 0.6; }
  .flyer { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-1.5deg);
    width: 1320px; height: 1180px; background: #f1ead0;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    padding: 90px 110px; box-sizing: border-box; }
  .flyer::before { content: ""; position: absolute; inset: 30px; border: 1.5px solid #1a0a08; opacity: 0.35; }
  .photocopy { position: absolute; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(circle at 25% 35%, rgba(40,30,10,0.10) 1px, transparent 2px),
      radial-gradient(circle at 65% 75%, rgba(40,30,10,0.08) 1px, transparent 2px);
    background-size: 9px 9px, 13px 13px;
    mix-blend-mode: multiply; }
  .staple { position: absolute; width: 30px; height: 8px;
    background: #5a5a5a; box-shadow: 1px 2px 0 rgba(0,0,0,0.3); }
  .s1 { left: 90px; top: 70px; transform: rotate(-20deg); }
  .s2 { right: 90px; top: 70px; transform: rotate(20deg); }
  .s3 { left: 90px; bottom: 70px; transform: rotate(20deg); }
  .s4 { right: 90px; bottom: 70px; transform: rotate(-20deg); }
  .top-strip { position: relative; text-align: center;
    font-family: "GrebackGrotesque", sans-serif; font-weight: 800; font-size: 38px;
    letter-spacing: 0.55em; color: #1a0a08; text-transform: uppercase; }
  .rip { width: 100%; height: 4px; background: #1a0a08; margin: 30px 0; opacity: 0.7; }
  .band-name { position: relative; font-family: "WBT", sans-serif; font-size: 320px;
    line-height: 0.95; color: #1a0a08; text-align: center; letter-spacing: -0.02em;
    transform: rotate(-2deg); margin-top: 30px;
    text-shadow: 2px 0 0 #1a0a08, -2px 0 0 #1a0a08, 0 2px 0 #1a0a08, 0 -2px 0 #1a0a08; }
  .hand-with { display: none; }
  .support { position: relative; font-family: "AvarezoSerif", "Georgia", serif; font-style: italic;
    font-size: 50px; color: #1a0a08; text-align: center; line-height: 1.4;
    margin-top: 80px; }
  .meta { position: absolute; left: 110px; bottom: 110px; right: 110px;
    border-top: 2px solid #1a0a08; padding-top: 18px;
    display: flex; justify-content: space-between;
    font-family: "GrebackGrotesque", sans-serif; font-weight: 800; font-size: 30px;
    letter-spacing: 0.4em; color: #1a0a08; text-transform: uppercase; }
  .corner { position: absolute; right: 110px; top: 230px;
    font-family: "WBT", sans-serif; font-size: 100px; color: #c81a1a; transform: rotate(-8deg);
    text-shadow: 2px 0 0 #c81a1a, -2px 0 0 #c81a1a, 0 2px 0 #c81a1a, 0 -2px 0 #c81a1a; }
  .price-line { display: none; }
</style>
<div class="canvas">
  <div class="pole"></div>
  <div class="grain"></div>
  <div class="flyer">
    <div class="photocopy"></div>
    <div class="staple s1"></div>
    <div class="staple s2"></div>
    <div class="staple s3"></div>
    <div class="staple s4"></div>
    <div class="top-strip">Basement Show — 21 &amp; over</div>
    <div class="rip"></div>
    <div class="band-name tag">Static Cure</div>
    <div class="hand-with tag">— with —</div>
    <div class="support">Iron Sash · Quiet Sister · Lower Town</div>
    <div class="corner tag">SAT</div>
    <div class="meta">
      <span>Friday — Doors Eight Sharp</span>
      <span>118 Pemberton · Cellar</span>
    </div>
  </div>
</div>
