html, body { margin: 0; padding: 0; }
html, body { width: 2880px; height: 1440px; }
.canvas { position: absolute; top: 0; left: 0; width: 2880px; height: 1440px; overflow: hidden;
  font-family: -apple-system, sans-serif; }
.tag { font-family: "WBT", sans-serif; }
* { font-feature-settings: "calt" 1, "liga" 1, "dlig" 1; }

  .canvas { background:
    radial-gradient(ellipse at 50% 60%, #2a2218 0%, #0a0805 100%); }
  .haze { position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,180,80,0.08) 0%, transparent 60%); }
  .deck { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-12deg);
    width: 2520px; height: 540px;
    background: #1a1614;
    border-radius: 270px / 290px;
    box-shadow: 0 60px 120px rgba(0,0,0,0.7),
      inset 0 0 0 8px #0a0806,
      inset 0 0 60px rgba(80,50,20,0.18); }
  .grain { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-12deg);
    width: 2520px; height: 540px;
    background-image: repeating-linear-gradient(90deg,
      rgba(120,80,40,0.16) 0 1px, transparent 1px 6px);
    border-radius: 270px / 290px; opacity: 0.55; pointer-events: none; }
  .stripe-rail { position: absolute; left: 50%; top: 50%; transform: translate(-50%, 240px) rotate(-12deg);
    width: 2380px; height: 18px;
    background: #c81a1a; opacity: 0.85; }
  .truck-l { position: absolute; left: 50%; top: 50%;
    transform: translate(-1100px, -50%) rotate(-12deg);
    width: 60px; height: 60px; border-radius: 50%;
    background: #d6d6d2; box-shadow: 0 0 0 6px #0a0806, 200px 0 0 0 #d6d6d2,
      200px 0 0 6px #0a0806; }
  .truck-l::after { content: ""; position: absolute; left: 100px; top: 0; width: 60px; height: 60px;
    border-radius: 50%; background: #d6d6d2; box-shadow: 0 0 0 6px #0a0806; }
  .truck-r { position: absolute; left: 50%; top: 50%;
    transform: translate(900px, -50%) rotate(-12deg);
    width: 60px; height: 60px; border-radius: 50%;
    background: #d6d6d2; box-shadow: 0 0 0 6px #0a0806, 200px 0 0 0 #d6d6d2,
      200px 0 0 6px #0a0806; }
  .truck-r::after { content: ""; position: absolute; left: 100px; top: 0; width: 60px; height: 60px;
    border-radius: 50%; background: #d6d6d2; box-shadow: 0 0 0 6px #0a0806; }
  .name { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-58%) rotate(-12deg);
    font-family: "WBT", sans-serif; font-size: 380px; line-height: 0.9; color: #f1ead0;
    white-space: nowrap; letter-spacing: -0.02em;
    text-shadow: 3px 0 0 #f1ead0, -3px 0 0 #f1ead0, 0 3px 0 #f1ead0, 0 -3px 0 #f1ead0; }
  .small { position: absolute; left: 50%; top: 50%; transform: translate(-50%, 110px) rotate(-12deg);
    font-family: "GrebackGrotesque", sans-serif; font-weight: 800; font-size: 28px;
    letter-spacing: 0.5em; color: #c81a1a; text-transform: uppercase; }
  .top-strip { position: absolute; left: 0; right: 0; top: 70px; text-align: center;
    font-family: "GrebackGrotesque", sans-serif; font-weight: 800; font-size: 32px;
    letter-spacing: 0.55em; color: #f1ead0; text-transform: uppercase; opacity: 0.7; }
  .bottom-l { position: absolute; left: 130px; bottom: 90px;
    font-family: "SicretMono", monospace; font-size: 28px; letter-spacing: 0.3em;
    color: #f1ead0; opacity: 0.85; }
  .bottom-r { position: absolute; right: 130px; bottom: 90px;
    font-family: "GrebackGrotesque", sans-serif; font-weight: 800; font-size: 28px;
    letter-spacing: 0.4em; color: #f1ead0; opacity: 0.85; text-transform: uppercase; }
</style>
