html, body { margin: 0; padding: 0; }
html, body { width: 2880px; height: 1440px; }
.canvas { position: absolute; top: 0; left: 0; width: 2880px; height: 1440px; overflow: hidden;
  font-family: -apple-system, sans-serif; }
.tag { font-family: "WBT", sans-serif; }
* { font-feature-settings: "calt" 1, "liga" 1, "dlig" 1; }

  .canvas { background:
    linear-gradient(180deg, #2a2820 0%, #14130e 100%); }
  .floor-tile { position: absolute; left: 0; right: 0; bottom: 0; height: 240px;
    background:
      repeating-linear-gradient(90deg, #58504a 0 140px, #4a423c 140px 142px, #58504a 142px 280px, #4a423c 280px 282px);
    box-shadow: 0 -3px 0 #0a0a08, inset 0 30px 40px rgba(0,0,0,0.4); }
  .bank { position: absolute; left: 0; right: 0; top: 0; bottom: 240px;
    background: linear-gradient(180deg, #6c8a5a 0%, #4a6840 100%);
    box-shadow: inset 0 30px 60px rgba(0,0,0,0.35), 0 30px 60px rgba(0,0,0,0.5); }
  .door { position: absolute; top: 0; bottom: 0; width: 480px;
    border-left: 6px solid #1a2014; box-sizing: border-box;
    background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.18) 100%); }
  .door.d1 { left: 0; }
  .door.d2 { left: 480px; }
  .door.d3 { left: 960px; }
  .door.d4 { left: 1440px; background:
    linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.14) 100%),
    radial-gradient(circle at 50% 50%, rgba(255,240,200,0.04) 0%, transparent 60%); }
  .door.d5 { left: 1920px; }
  .door.d6 { left: 2400px; }
  .door.d4 .vents { background: repeating-linear-gradient(90deg, #6c8a5a 0 8px, #1a2014 8px 12px); }
  .vents { position: absolute; left: 50%; top: 100px; transform: translateX(-50%);
    width: 220px; height: 70px;
    background: repeating-linear-gradient(90deg, #6c8a5a 0 8px, #1a2014 8px 12px);
    box-shadow: inset 0 0 0 4px #1a2014; }
  .lock { position: absolute; left: 50%; top: 280px; transform: translateX(-50%);
    width: 130px; height: 130px; border-radius: 50%;
    background: #d6d6d2;
    box-shadow: inset 0 0 0 6px #1a2014, 0 6px 0 rgba(0,0,0,0.35); }
  .lock::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 16px; height: 16px; border-radius: 50%; background: #1a2014; }
  .number { position: absolute; left: 0; right: 0; top: 50px; text-align: center;
    font-family: "GrebackGrotesque", sans-serif; font-weight: 800; font-size: 36px;
    letter-spacing: 0.2em; color: #d6d6d2; text-transform: uppercase; opacity: 0.85; }
  .scrawl { position: absolute; left: 80px; right: 80px; top: 50%; transform: translateY(-50%) rotate(-3deg);
    font-family: "WBT", sans-serif; font-size: 580px; line-height: 0.9; color: #1a0a08;
    text-align: center; white-space: nowrap;
    text-shadow: 3px 0 0 #1a0a08, -3px 0 0 #1a0a08, 0 3px 0 #1a0a08, 0 -3px 0 #1a0a08; }
  .small-tag { position: absolute; left: 200px; top: 260px;
    font-family: "WBT", sans-serif; font-size: 130px; color: #c81a1a; transform: rotate(-12deg); }
  .sticker { position: absolute; left: 200px; bottom: 40px; transform: rotate(-3deg);
    background: #f3d22a; padding: 10px 24px;
    font-family: "GrebackGrotesque", sans-serif; font-weight: 800; font-size: 22px;
    letter-spacing: 0.35em; color: #1a0a08; text-transform: uppercase; }
  .ground-shadow { position: absolute; left: 0; right: 0; bottom: 240px; height: 24px;
    background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, transparent 100%); }
</style>
