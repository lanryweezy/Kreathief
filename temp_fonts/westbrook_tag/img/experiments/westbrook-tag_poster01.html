html, body { margin: 0; padding: 0; }
html, body { width: 2880px; height: 1440px; }
.canvas { position: absolute; top: 0; left: 0; width: 2880px; height: 1440px; overflow: hidden;
  font-family: -apple-system, sans-serif; }
.tag { font-family: "WBT", sans-serif; }
* { font-feature-settings: "calt" 1, "liga" 1, "dlig" 1; }

  .canvas { background: #1a1814; }
  .lamp { position: absolute; left: 0; right: 0; top: 0; height: 320px;
    background: linear-gradient(180deg, rgba(240,220,160,0.32) 0%, transparent 100%);
    pointer-events: none; }
  .tile-wall { position: absolute; left: 80px; right: 80px; top: 70px; bottom: 220px;
    background-color: #f0e6c0;
    background-image:
      linear-gradient(90deg, #2a2418 0 2px, transparent 2px),
      linear-gradient(0deg,  #2a2418 0 2px, transparent 2px);
    background-size: 200px 120px, 200px 120px;
    box-shadow: inset 0 60px 80px rgba(60,40,20,0.18); }
  .stains { position: absolute; left: 80px; right: 80px; top: 70px; bottom: 220px;
    background-image:
      radial-gradient(ellipse 200px 80px at 18% 12%, rgba(80,60,30,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 240px 100px at 86% 88%, rgba(60,40,20,0.20) 0%, transparent 65%),
      radial-gradient(circle at 36% 76%, rgba(60,40,20,0.10) 1px, transparent 2px),
      radial-gradient(circle at 64% 30%, rgba(60,40,20,0.10) 1px, transparent 2px);
    background-size: 100% 100%, 100% 100%, 11px 11px, 17px 17px;
    pointer-events: none; mix-blend-mode: multiply; }
  .gum { position: absolute; left: 350px; top: 870px; width: 26px; height: 18px;
    background: #5a4a30; border-radius: 50% / 60%; opacity: 0.7; transform: rotate(20deg); }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 220px;
    background: linear-gradient(180deg, #2c241a 0%, #1a140e 100%);
    box-shadow: 0 -2px 0 #050300; }
  .yellow-line { position: absolute; left: 0; right: 0; bottom: 220px; height: 14px;
    background: #d8a020; box-shadow: 0 -2px 0 #aa6c08; }
  .station-sign { position: absolute; left: 50%; top: 110px; transform: translateX(-50%);
    background: #050505; padding: 16px 80px;
    font-family: "GrebackGrotesque", sans-serif; font-weight: 800; font-size: 56px;
    letter-spacing: 0.5em; color: #f0e6c0; text-transform: uppercase;
    border: 4px solid #f0e6c0; }
  .name { position: absolute; left: 50%; top: 56%; transform: translate(-50%,-50%) rotate(-7deg);
    font-family: "WBT", sans-serif; font-size: 540px; line-height: 0.9; color: #0a0a08;
    white-space: nowrap;
    text-shadow:
      4px 0 0 #0a0a08, -4px 0 0 #0a0a08, 0 4px 0 #0a0a08, 0 -4px 0 #0a0a08; }
  .name::after { content: ""; position: absolute; left: 12%; top: 100%; width: 14px; height: 110px;
    background: linear-gradient(180deg, #0a0a08 0%, transparent 100%); transform: rotate(-3deg); opacity: 0.7; }
  .bottom-l { position: absolute; left: 130px; bottom: 60px;
    font-family: "GrebackGrotesque", sans-serif; font-weight: 800; font-size: 32px;
    letter-spacing: 0.3em; color: #f0e6c0; text-transform: uppercase; opacity: 0.85; }
  .bottom-r { position: absolute; right: 130px; bottom: 60px;
    font-family: "SicretMono", monospace; font-size: 30px; letter-spacing: 0.25em;
    color: #f0e6c0; opacity: 0.85; }
</style>

  <div class="floor"></div>

  <div class="bottom-l">— Måns Grebäck —</div>
