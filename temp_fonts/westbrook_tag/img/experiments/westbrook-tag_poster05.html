html, body { margin: 0; padding: 0; }
html, body { width: 2880px; height: 1440px; }
.canvas { position: absolute; top: 0; left: 0; width: 2880px; height: 1440px; overflow: hidden;
  font-family: -apple-system, sans-serif; }
.tag { font-family: "WBT", sans-serif; }
* { font-feature-settings: "calt" 1, "liga" 1, "dlig" 1; }

  .canvas { background:
    linear-gradient(180deg, #c8a878 0%, #a08a60 100%); }
  .desk-grain { position: absolute; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 35%, rgba(80,50,20,0.10) 1px, transparent 2px),
      radial-gradient(circle at 65% 75%, rgba(80,50,20,0.08) 1px, transparent 2px);
    background-size: 11px 11px, 17px 17px; }
  .page { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-1deg);
    width: 2240px; height: 1240px;
    background: linear-gradient(180deg, #fdf8e0 0%, #f8efc8 100%);
    box-shadow: 0 40px 100px rgba(60,30,4,0.55), inset 0 0 80px rgba(180,140,80,0.12); }
  .holes { position: absolute; left: 60px; top: 0; bottom: 0; width: 60px;
    display: flex; flex-direction: column; justify-content: space-around; align-items: center;
    padding: 60px 0; }
  .holes .h { width: 38px; height: 38px; border-radius: 50%; background: #c8a878;
    box-shadow: inset 0 6px 0 rgba(60,30,4,0.45); }
  .margin { position: absolute; left: 200px; top: 80px; bottom: 80px; width: 4px;
    background: #c84840; }
  .lines { position: absolute; left: 220px; right: 80px; top: 80px; bottom: 80px;
    background-image: repeating-linear-gradient(0deg,
      transparent 0 87px, #5a8ac0 87px 89px); opacity: 0.5; }
  .scrawl { position: absolute; left: 220px; right: 80px; top: 160px;
    font-family: "WBT", sans-serif; font-size: 280px; line-height: 0.95; color: #18283c;
    transform: rotate(-2deg);
    text-shadow: 2px 0 0 #18283c, -2px 0 0 #18283c, 0 2px 0 #18283c, 0 -2px 0 #18283c; }
  .body { position: absolute; left: 240px; right: 280px; top: 600px;
    font-family: "WBT", sans-serif; font-size: 80px; line-height: 1.35; color: #18283c;
    transform: rotate(-1deg); }
  .doodle-arrow { position: absolute; right: 280px; top: 850px;
    font-family: "WBT", sans-serif; font-size: 180px; color: #c84840; transform: rotate(38deg); }
  .heart { position: absolute; right: 220px; top: 500px;
    width: 120px; height: 110px;
    background:
      radial-gradient(circle at 32% 38%, #c84840 22%, transparent 24%) 0 0/60px 60px no-repeat,
      radial-gradient(circle at 68% 38%, #c84840 22%, transparent 24%) 60px 0/60px 60px no-repeat,
      linear-gradient(45deg, transparent 0%, transparent 50%, #c84840 50%, #c84840 100%) 0 30px/120px 50px no-repeat;
    transform: rotate(8deg); opacity: 0.85; }
  .star { position: absolute; left: 320px; bottom: 220px;
    font-family: "WBT", sans-serif; font-size: 200px; color: #18283c; transform: rotate(-12deg); }
  .date { position: absolute; left: 130px; top: 130px; transform: rotate(-90deg) translateX(-220px);
    transform-origin: 0 0;
    font-family: "WBT", sans-serif; font-size: 90px; color: #c84840;
    white-space: nowrap; }
  .corner-fold { position: absolute; right: 0; bottom: 0; width: 100px; height: 100px;
    background: linear-gradient(135deg, transparent 50%, #d8c298 50%);
    box-shadow: -4px -4px 8px rgba(60,30,4,0.3); }
</style>

  <div class="page">
    <div class="holes"><div class="h"></div><div class="h"></div><div class="h"></div><div class="h"></div></div>

    <div class="scrawl tag">Friday Already</div>
    <div class="body tag">third period geometry — chair leg<br/>still wobbling. theorem of the week:<br/>two blocks before the bell rings → run.</div>
    <div class="doodle-arrow tag">↘</div>
    <div class="heart"></div>

    <div class="date tag">Tuesday — March 14</div>
    <div class="corner-fold"></div>
  </div>
