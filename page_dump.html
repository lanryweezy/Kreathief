/* ===== Base Styles ===== */
:root {
  --ultra-indigo: #8b5cf6;
  --cosmic-cyan: #22d3ee;
  --cyber-pink: #e8909c;
  --deep-space: #0d0d12;
  --matte-black: #111118;
  --glass-white: rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.06);
  /* 2026 semantic tokens */
  --color-success: #34d399;
  --color-warning: #fbbf24;
  --color-error: #f87171;
  --color-info: #60a5fa;
  --surface-warm: #16161e;
  --surface-elevated: #1e1e28;
}

body {
  font-family: 'Outfit', 'Inter', sans-serif;
  background-color: var(--deep-space);
  color: #f5f5f7;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  /* Mobile safe area support */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

#root {

}

h1,
h2,
h3,
h4,
.font-display {

  letter-spacing: -0.02em;
}

/* ===== Premium Visuals ===== */

.mesh-gradient {
  background:
    radial-gradient(circle at 0% 0%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
    radial-gradient(circle at 100% 0%, rgba(34, 211, 238, 0.08) 0%, transparent 50%),

.light-section {

/* Custom Scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  border: 1px solid transparent;
  background-clip: padding-box;
  -webkit-transition: all 0.3s ease;
  transition: all 0.3s ease;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.15);
  background-clip: padding-box;
}

/* For Firefox */
* {
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
}

/* Base tailwind additions for the "Million Dollar" feel */

/* Rotating Neon Border */
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

@keyframes spin-gradient {
  to {
    --angle: 360deg;
  }
}

.animated-border-wrapper {
  position: relative;
  border-radius: inherit;
  z-index: 1;
}

.animated-border-wrapper::before {
  content: '';
  position: absolute;
  inset: -1.5px;
  border-radius: inherit;
  background: conic-gradient(from var(--angle), transparent 70%, #7c3aed 90%, #e8909c 100%);
  animation: spin-gradient 3s linear infinite;
  z-index: -1;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.group:hover > .animated-border-wrapper::before {
  opacity: 1;
}

/* ===== Mobile Optimizations ===== */

/* Safe area utilities for mobile devices with notches */

/* Mobile touch improvements */
@media (max-width: 768px) {
  /* Larger touch targets */
  button,
  a,
  [role='button'] {
    min-height: 44px;
    min-width: 44px;
  }

  /* Mobile-optimized bottom sheet content */
  .mobile-optimized button {
    min-height: 48px !important;
    padding: 12px 16px !important;
    font-size: 15px !important;
    border-radius: 12px !important;
  }

  .mobile-optimized input,
  .mobile-optimized textarea {
    min-height: 48px !important;
    padding: 12px 16px !important;
    font-size: 15px !important;
    border-radius: 12px !important;
  }

  .mobile-optimized .grid {
    gap: 16px !important;
  }

  .mobile-optimized label {
    font-size: 14px !important;
    font-weight: 600 !important;
    margin-bottom: 8px !important;
  }

  .mobile-optimized [role='button'],
  .mobile-optimized .clickable {
    min-height: 48px !important;
  }

  /* Smooth scrolling on mobile */
  * {
    -webkit-overflow-scrolling: touch;
  }

  /* Prevent text selection on mobile UI elements */
  .no-select {
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
  }

  /* Better input focus on mobile */
  input:focus,
  textarea:focus {
    font-size: 16px; /* Prevents zoom on iOS */
  }

  /* Smooth animations on mobile */
  * {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
}

/* Mobile panel wrapper optimizations */
.mobile-panel-wrapper button {
  min-height: 48px;
  padding: 12px 16px;
  font-size: 15px;
}

.mobile-panel-wrapper input,
.mobile-panel-wrapper textarea {
  min-height: 48px;
  padding: 12px 16px;
  font-size: 15px;
}

.mobile-panel-wrapper .grid {
  gap: 16px;
}

.mobile-panel-wrapper label {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
}

.mobile-panel-wrapper .text-xs {
  font-size: 13px;
}

.mobile-panel-wrapper .text-sm {
  font-size: 14px;
}

/* Larger touch targets for mobile */
.mobile-panel-wrapper .icon-button {
  min-width: 48px;
  min-height: 48px;
}

/* Better spacing for cards */
.mobile-panel-wrapper .card,
.mobile-panel-wrapper [class*='rounded'] {
  padding: 16px;
}

/* Scrollable areas with better padding */
.mobile-panel-wrapper .overflow-y-auto {
  padding-bottom: 24px;
}

/* Mobile-specific animations */
@media (prefers-reduced-motion: no-preference) {
  @media (max-width: 768px) {
    .mobile-slide-up {
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .mobile-fade-in {
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  }
}

/* PWA support */
@media (display-mode: standalone) {
  body {
    padding-top: env(safe-area-inset-top);
  }
}
